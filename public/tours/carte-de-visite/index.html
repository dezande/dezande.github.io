<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'">
	<meta name="theme-color" content="#140b05">
	<meta name="color-scheme" content="dark">
	<meta name="format-detection" content="telephone=no">
	<meta name="description" content="Carte de visite du Théâtre Robert-Houdin — accessoire de scène hors-ligne">
	<title>Carte de visite</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- Toute l'app : pivote en paysage pour rester en portrait (src/kit/web/orientation.ts). -->
	<div id="app">
		<main id="stage">
			<!-- La vieille table de bois, dessinée par src/tours/carte-de-visite/stage/table.ts. -->
			<svg id="table" aria-hidden="true"></svg>
			<div class="lampe"></div>

			<!-- La carte de visite du Théâtre Robert-Houdin, le théâtre de magie que Jean-Eugène
			     Robert-Houdin ouvrit à Paris en 1845, et que Georges Méliès reprit en 1888 ; il était au 8,
			     boulevard des Italiens, et fut démoli en 1924. Le recto imprimé ; au verso, seulement le
			     numéro, en grand, écrit à la plume. Elle se retourne à la fin du délai (stage/carte.ts). -->
			<div class="carte" id="carte">
				<div class="faces">
					<article class="face recto">
						<svg class="coin hg" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 38V14C2 7 7 2 14 2h24M8 38V18c0-6 4-10 10-10h20M14 20c0-3 3-6 6-6 3 0 4 2 4 4s-2 3-3 3"/></svg>
						<svg class="coin hd" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 38V14C2 7 7 2 14 2h24M8 38V18c0-6 4-10 10-10h20M14 20c0-3 3-6 6-6 3 0 4 2 4 4s-2 3-3 3"/></svg>
						<svg class="coin bg" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 38V14C2 7 7 2 14 2h24M8 38V18c0-6 4-10 10-10h20M14 20c0-3 3-6 6-6 3 0 4 2 4 4s-2 3-3 3"/></svg>
						<svg class="coin bd" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 38V14C2 7 7 2 14 2h24M8 38V18c0-6 4-10 10-10h20M14 20c0-3 3-6 6-6 3 0 4 2 4 4s-2 3-3 3"/></svg>
						<!-- Le chiffre du théâtre : R et H entrelacés dans une couronne de laurier. -->
						<svg class="chiffre" viewBox="0 0 120 120" aria-hidden="true">
							<g class="laurier">
								<path d="M60 108C30 104 14 82 16 52c1-14 7-26 16-34"/>
								<path d="M60 108c30-4 46-26 44-56-1-14-7-26-16-34"/>
								<g class="feuilles">
									<path d="M18 70c-7-3-10-9-9-15 6 2 10 7 9 15z"/>
									<path d="M17 56c-6-4-8-10-6-16 6 3 8 9 6 16z"/>
									<path d="M20 42c-5-5-6-11-3-16 5 4 6 10 3 16z"/>
									<path d="M26 30c-3-6-3-12 1-16 4 5 3 11-1 16z"/>
									<path d="M24 84c-8-1-12-6-13-12 7 0 12 5 13 12z"/>
									<path d="M34 96c-8 1-13-3-16-9 7-1 13 3 16 9z"/>
									<path d="M47 104c-7 3-13 0-17-5 7-2 13 0 17 5z"/>
								</g>
								<g class="feuilles" transform="matrix(-1 0 0 1 120 0)">
									<path d="M18 70c-7-3-10-9-9-15 6 2 10 7 9 15z"/>
									<path d="M17 56c-6-4-8-10-6-16 6 3 8 9 6 16z"/>
									<path d="M20 42c-5-5-6-11-3-16 5 4 6 10 3 16z"/>
									<path d="M26 30c-3-6-3-12 1-16 4 5 3 11-1 16z"/>
									<path d="M24 84c-8-1-12-6-13-12 7 0 12 5 13 12z"/>
									<path d="M34 96c-8 1-13-3-16-9 7-1 13 3 16 9z"/>
									<path d="M47 104c-7 3-13 0-17-5 7-2 13 0 17 5z"/>
								</g>
								<path class="ruban" d="M50 106c4 4 16 4 20 0M54 108l-6 8M66 108l6 8"/>
							</g>
							<text class="lettre r" x="47" y="76">R</text>
							<text class="lettre h" x="73" y="76">H</text>
						</svg>
						<div class="titre">
							<p class="fondee">Fondé en 1845</p>
							<h1 class="nom">
								<span class="nom-petit">Théâtre</span>
								<span class="nom-grand">Robert-Houdin</span>
							</h1>
							<p class="adresse">8, Boulevard des Italiens · Paris</p>
						</div>
						<p class="confort">Soirées fantastiques</p>
					</article>

					<article class="face verso">
						<svg class="coin hg" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 38V14C2 7 7 2 14 2h24M8 38V18c0-6 4-10 10-10h20M14 20c0-3 3-6 6-6 3 0 4 2 4 4s-2 3-3 3"/></svg>
						<svg class="coin hd" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 38V14C2 7 7 2 14 2h24M8 38V18c0-6 4-10 10-10h20M14 20c0-3 3-6 6-6 3 0 4 2 4 4s-2 3-3 3"/></svg>
						<svg class="coin bg" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 38V14C2 7 7 2 14 2h24M8 38V18c0-6 4-10 10-10h20M14 20c0-3 3-6 6-6 3 0 4 2 4 4s-2 3-3 3"/></svg>
						<svg class="coin bd" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 38V14C2 7 7 2 14 2h24M8 38V18c0-6 4-10 10-10h20M14 20c0-3 3-6 6-6 3 0 4 2 4 4s-2 3-3 3"/></svg>
						<!-- Le numéro seul, en grand, à la plume. -->
						<span class="numero" id="number"><span id="number-text"></span></span>
					</article>
				</div>
			</div>

			<div class="vignette"></div>
		</main>

		<div id="hold-ring" aria-hidden="true" hidden><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="fill" cx="50" cy="50" r="44" pathLength="100"/></svg></div>
		<div id="dim"></div>
		<div id="zones" hidden></div>

		<div id="testbar" hidden>
			<span class="state" id="test-state">Prêt</span>
			<button type="button" id="test-back">Réglages</button>
			<button type="button" id="test-quit">Quitter</button>
		</div>

		<section id="settings" hidden aria-label="Réglages">
			<div class="sheet">
				<!-- En-tête commun à tous les tours (« Mes tours ») : « Réglages » et le nom du tour,
				     remplis par src/tours/pont.ts, et la croix qui ferme. -->
				<header class="menu-head">
					<div>
						<h1 class="titre-reglages"></h1>
						<p class="sub nom-du-tour"></p>
					</div>
					<button type="button" id="close-btn" class="croix" aria-label="Fermer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
				</header>

				<div class="card">
					<div class="row-label">Arcane Système <small>4 coins de l'écran</small></div>
					<div class="values" id="routine-values"></div>
				</div>

				<div class="card">
					<label class="row-label" for="delay">Délai avant le retournement <output id="delay-out"></output></label>
					<input id="delay" type="range" min="0" max="10" step="0.5">
				</div>

				<div class="card">
					<label class="row-label" for="fade">Durée du retournement <output id="fade-out"></output></label>
					<input id="fade" type="range" min="0.5" max="6" step="0.1">
				</div>

				<div class="card">
					<label class="row-label" for="brightness">Luminosité <output id="brightness-out"></output></label>
					<input id="brightness" type="range" min="30" max="100" step="5">
				</div>

				<div class="card options">
					<p class="hint">Aide à la répétition : à masquer avant de jouer si le public voit l'écran.</p>
					<label class="toggle-row" for="show-hold-ring">Afficher la jauge de l'appui long <input id="show-hold-ring" type="checkbox"></label>
					<button type="button" id="test-btn" class="test-zones">Test des zones</button>
				</div>

				<button type="button" id="defaults-btn" class="link">Rétablir les réglages par défaut</button>
			</div>
		</section>
	</div>

	<script type="module" src="app.js"></script>
</body>
</html>
