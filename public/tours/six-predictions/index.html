<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'">
	<meta name="theme-color" content="#071a0f">
	<meta name="color-scheme" content="dark">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Six prédictions">
	<meta name="format-detection" content="telephone=no">
	<meta name="description" content="Six cartes à prédictions qui se retournent au toucher, puis sortent du cadre — six prediction cards that flip at a touch, then leave the frame. 100 % hors-ligne.">
	<title>Les six prédictions</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!--
		Le texte de l'interface n'est pas écrit ici : chaque élément porte une clé
		(data-texte, data-texte-label) remplie dans les deux langues depuis
		src/content/interface.ts (src/settings/langue.ts).
	-->
	<!-- Toute l'app : pivote en paysage pour rester en portrait (src/kit/web/orientation.ts). -->
	<div id="app">
		<main id="stage">
			<!-- Les six cartes, construites par src/stage/paquet.ts. -->
			<div id="paquet"></div>
		</main>

		<!-- Ce qui est à l'écran, pour les lecteurs d'écran seulement. -->
		<p id="annonce" class="sr-only" aria-live="polite"></p>
		<div id="hold-ring" aria-hidden="true" hidden><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="fill" cx="50" cy="50" r="44" pathLength="100"/></svg></div>

		<section id="menu" hidden data-texte-label="menu.titre">
			<div class="sheet">
				<header class="menu-head">
					<div>
						<h1 data-texte="menu.titre"></h1>
						<p class="menu-version" id="menu-version"></p>
					</div>
					<span id="menu-position" hidden></span>
				</header>

				<!-- Le menu ne s'ouvre plus qu'en réglages (écrou ⚙) : ni carte à choisir, ni paquet à remettre. -->
				<div class="card" hidden>
					<div class="row-label" data-texte="menu.aller"></div>
					<div id="carte-list" class="carte-list"></div>
				</div>

				<div class="actions">
					<button type="button" id="reset-btn" data-texte="menu.remettre" hidden></button>
					<button type="button" id="close-btn" class="primary" data-texte="menu.fermer"></button>
				</div>

				<!-- La langue se choisit dans le menu principal de Mes tours (bouton FR / EN), pour tous les tours. -->
				<div class="card" hidden>
					<div class="row-label" data-texte="menu.langue"></div>
					<div class="seg" id="langue-seg" role="radiogroup" data-texte-label="menu.langue"></div>
				</div>

				<!-- Les dos et les couleurs se choisissent en les regardant : chaque bouton montre
				     la carte telle qu'elle sera, pas le nom du style (settings/panel.ts). -->
				<div class="card">
					<div class="row-label" data-texte="menu.motif"></div>
					<div class="vignettes" id="motif-choix" role="radiogroup" data-texte-label="menu.motif"></div>
				</div>

				<div class="card">
					<div class="row-label" data-texte="menu.couleur"></div>
					<div class="vignettes couleurs" id="couleur-choix" role="radiogroup" data-texte-label="menu.couleur"></div>
				</div>

				<div class="card options">
					<p class="hint" data-texte="menu.aides"></p>
					<label class="toggle-row" for="show-hold-ring"><span data-texte="menu.jauge"></span> <input id="show-hold-ring" type="checkbox"></label>
				</div>

				<div class="card status">
					<span class="dot" id="wake-dot"></span>
					<div><span id="wake-text"></span><small id="wake-detail"></small></div>
				</div>

				<div class="card about">
					<div class="about-row"><span data-texte="menu.version"></span> <span id="about-version"></span></div>
					<div class="about-row"><span data-texte="menu.cache"></span> <span id="about-cache"></span></div>
					<div class="about-row"><span data-texte="menu.stockage"></span> <span id="about-storage"></span></div>
					<div class="about-row"><span data-texte="menu.affichage"></span> <span id="about-display"></span></div>
				</div>

				<details class="card help">
					<summary data-texte="aide.titre"></summary>
					<ul>
						<li data-texte="aide.premier"></li>
						<li data-texte="aide.second"></li>
						<li data-texte="aide.vide"></li>
						<li data-texte="aide.appui"></li>
						<li data-texte="aide.clavier"></li>
					</ul>
				</details>

				<button type="button" id="defaults-btn" class="link" data-texte="menu.defauts"></button>
			</div>
		</section>
	</div>

	<script type="module" src="app.js"></script>
</body>
</html>
