name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur une pull request annule la vérification devenue inutile de la précédente.
# Jamais sur main : chaque fusion doit aller jusqu'à la publication.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Types, tests, build et tests dans Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : le numéro de version est le nombre de commits.
          fetch-depth: 0
          # Le kit commun (src/kit, dépôt kit-scene).
          submodules: true

      - uses: actions/setup-node@v7
        with:
          # Version de Node figée pour tout le monde (.nvmrc).
          node-version-file: .nvmrc
          cache: npm

      # Chaque changement doit s'accompagner d'une entrée dans CHANGELOG.md.
      - name: Journal des versions
        run: node src/kit/node/check-changelog.ts --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      - run: npm ci

      # Types et tests tournent sur la pull request, dont la branche doit être à jour avec main
      # et la CI verte pour fusionner : après la fusion en rebase, main porte exactement l'arbre
      # déjà vérifié. On ne le revérifie donc pas, on le construit et on le publie.
      # « workflow_dispatch » (lancement à la main) rejoue tout.
      - name: Vérification des types
        if: github.event_name != 'push'
        run: npm run typecheck

      - name: Tests unitaires
        if: github.event_name != 'push'
        run: npm test

      - name: Build
        run: npm run build

      # L'app compilée dans Chrome sans interface, sur un écran de téléphone simulé :
      # chaque routine jusqu’au retour au menu, l’écrou des réglages, la sortie de secours et le hors-ligne.
      # Google Chrome est préinstallé sur les machines ubuntu de GitHub (variable CHROME_BIN).
      # En cas d'échec, rien n'est publié.
      # Limite de temps : une page de Chrome qui ne se ferme pas ne doit plus bloquer la CI 20 minutes.
      - name: Tests dans Chrome
        if: github.event_name != 'push'
        timeout-minutes: 6
        run: npm run test:e2e

      - name: Artefact GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Le vrai Chrome d'Android, sur un émulateur : là où sont apparus les bugs du toucher.
  # Vrais gestes Android (toucher, appui long, touche retour), voir tests/android.
  # Sur les pull requests seulement, à côté des tests dans Chrome de bureau.
  android:
    name: Tests dans Chrome pour Android (émulateur)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # L'émulateur a besoin de l'accélération matérielle (KVM) de la machine.
      - name: Accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests dans Chrome pour Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: npm run test:android

      - name: Capture de l'émulateur en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-ecran
          path: android-ecran.png
          if-no-files-found: ignore

  deploy:
    name: Déploiement GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
